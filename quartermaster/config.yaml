name: Quartermaster
version: "1.32.5"
slug: quartermaster
description: Self-hosted kitchen inventory for your household
url: https://github.com/jbg/quartermaster
arch:
  - amd64
  - aarch64
startup: application
boot: auto
image: ghcr.io/jbg/quartermaster
ingress: true
ingress_port: 8080
panel_icon: mdi:archive-search-outline
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Quartermaster web and API (not used for ingress)
watchdog: http://[HOST]:[PORT:8080]/healthz
backup: hot
stage: experimental
options:
  public_base_url: ""
  registration_mode: first_run_only
  expiry_reminders_enabled: true
  expiry_reminder_lead_days: 1
  expiry_reminder_fire_hour: 9
  expiry_reminder_fire_minute: 0
  off_credential_encryption_key: ""
  supplier_credential_encryption_key: ""
  ai_provider: disabled
  ai_model: ""
  ai_retain_raw_responses: false
  ai_openrouter_api_key: ""
  ai_openrouter_base_url: https://openrouter.ai/api/v1
  auth_session_cleanup_interval_seconds: 86400
  expiry_reminder_reconcile_interval_seconds: 3600
  log_format: json
  rust_log: info
schema:
  public_base_url: str?
  registration_mode: list(first_run_only|invite_only|open)
  expiry_reminders_enabled: bool
  expiry_reminder_lead_days: int(0,)
  expiry_reminder_fire_hour: int(0,23)
  expiry_reminder_fire_minute: int(0,59)
  off_credential_encryption_key: password?
  supplier_credential_encryption_key: password?
  ai_provider: list(disabled|openrouter)
  ai_model: str?
  ai_retain_raw_responses: bool
  ai_openrouter_api_key: password?
  ai_openrouter_base_url: str
  auth_session_cleanup_interval_seconds: int(0,)
  expiry_reminder_reconcile_interval_seconds: int(0,)
  log_format: list(text|json)
  rust_log: str
